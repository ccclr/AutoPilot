[package]
name = "primary"
version = "0.1.0"
authors = ["Libra <oncall+libra@xmail.facebook.com>"]
publish = false
edition = "2018"

[dependencies]
futures = "0.3.6"
serial_test = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.46.0", features = ["sync", "rt", "macros", "time", "io-util", "process", "fs"] }
tokio-util = { version = "0.7.4", features= ["codec", "time"] }
ed25519-dalek = "1.0.1"
thiserror = "1.0.20"
bincode = "1.3.1"
bytes = "1.0.1"
env_logger = "0.7.1"
log = "0.4.11"
async-recursion = "0.3.2"
async-trait = "0.1.50"
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"

rand = "0.7.3"
crypto = { path = "../crypto" }
store = { path = "../store" }
config = { path = "../config" }
network = { path = "../network" }
#sailfish = { path = "../sailfish"}

[dev-dependencies]
rand = "0.7.3"

[features]
benchmark = []
